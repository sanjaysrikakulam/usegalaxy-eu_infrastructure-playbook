---
users:
  processor_nemo@3dtrees.earth:  # 3Dtrees processing account for NEMO 2
    rules:
      - id: nemo-3dtrees-tools
        if: |
          tool.id.startswith('toolshed.g2.bx.psu.edu/repos/bgruening/3dtrees_')
        scheduling:
          require:
            - nemo-3dtrees
  bjoern.gruening@gmail.com:
    rules:
      - id: user-specific-notebook
        if: |
          'interactive_tool_jupyter_notebook' in tool.id
        cores: 1
        mem: 15
  andreas.kalagasidis@gmail.com:
    rules:
      - id: user-specific-notebook
        if: |
          'interactive_tool_jupyter_notebook' in tool.id
        cores: 1
        mem: 15
  '^alice@example\.org$':
    rules:
      - id: byoc-pulsar-alice01
        if: true
        scheduling:
          prefer:
            - alice01-byoc-pulsar
        rank: |
          byoc = [d for d in candidate_destinations if d.id == "pulsar_alice01_byoc_tpv"]
          byoc + helpers.weighted_random_sampling([d for d in candidate_destinations if d.id != "pulsar_alice01_byoc_tpv"])
  '^bob@example\.org$':
    rules:
      - id: byoc-pulsar-bob01
        if: true
        scheduling:
          prefer:
            - bob01-byoc-pulsar
        rank: |
          byoc = [d for d in candidate_destinations if d.id == "pulsar_bob01_byoc_tpv"]
          byoc + helpers.weighted_random_sampling([d for d in candidate_destinations if d.id != "pulsar_bob01_byoc_tpv"])
  '^grace@example\.org$':
    rules:
      - id: byoc-pulsar-grace01
        if: true
        scheduling:
          prefer:
            - grace01-byoc-pulsar
        rank: |
          byoc = [d for d in candidate_destinations if d.id == "pulsar_grace01_byoc_tpv"]
          byoc + helpers.weighted_random_sampling([d for d in candidate_destinations if d.id != "pulsar_grace01_byoc_tpv"])
